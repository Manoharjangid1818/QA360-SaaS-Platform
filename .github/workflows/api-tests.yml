name: Playwright Tests - API Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      api-server:
        image: ${{ secrets.API_IMAGE || 'node:18-alpine' }}
        options: >-
          --health-cmd="node -e \"require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})\"" 
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5000:5000
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install
      
      - name: Run API tests
        run: npm run test:api
        env:
          API_URL: http://localhost:5000
          TEST_TIMEOUT: 30000
      
      - name: Generate reports
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            playwright-report/
            allure-report/
            test-results/
          retention-days: 30
      
      - name: Analyze API response times
        if: always()
        run: |
          npm run test:report || true
      
      - name: Post results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./test-results/results.json', 'utf8'));
            console.log('Test Results:', results);
